[project]
name = "qmd-finetune"
version = "0.1.0"
description = "QMD query expansion fine-tuning tools"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "trl>=0.12.0",
  "peft>=0.7.0",
  "transformers>=4.45.0",
  "accelerate>=0.24.0",
  "huggingface_hub>=0.20.0",
  "trackio",
  "datasets",
  "pyyaml",
  "gguf",
  "sentencepiece",
  "nvidia-ml-py",
  "pydantic>=2.0",
]

[dependency-groups]
dev = []

[tool.uv]
# Preserve the historical cutoff; admit only the fixed certifi release window.
exclude-newer = "2026-04-04T01:01:35Z"
exclude-newer-package = { certifi = "2026-10-20T02:24:17Z" }
constraint-dependencies = [
  "certifi>=2026.10.19",
  "authlib>=1.6.9",
  "aiohttp>=3.13.4",
  "cryptography>=46.0.7",
]
